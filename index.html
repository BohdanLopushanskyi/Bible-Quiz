<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top"><h1>Bible Quiz</h1></header>

<!-- HOME: your saved quizzes -->
<section id="home" class="screen">
  <div class="bar">
    <button class="btn gold" id="newBtn">+ New quiz</button>
    <label class="btn">Import JSON<input type="file" id="imp" accept=".json" hidden></label>
    <label class="set">Timer in seconds (0 = off) <input type="number" id="secs" min="0" max="300" value="0"></label>
  </div>
  <div class="comp">
    <label class="chk"><input type="checkbox" id="compOn"> Competitive mode (teams)</label>
    <div id="compBox">
      <label class="lbl">Team names, one per line (2 to 8 teams)<textarea id="teamNames" rows="4"></textarea></label>
      <label class="set">Points per correct answer <input type="number" id="pts" min="1" max="1000" value="10"></label>
    </div>
  </div>
  <div id="list"></div>
</section>

<!-- EDITOR: create or change a quiz -->
<section id="editor" class="screen" hidden>
  <label class="lbl">Quiz title <input id="etitle" maxlength="80"></label>
  <div id="qlist"></div>
  <div class="form">
    <h3 id="formHead">Add a question</h3>
    <label class="lbl">Question <textarea id="fq" rows="2"></textarea></label>
    <div id="fans"></div>
    <label class="lbl">Bible reference (optional) <input id="fref" placeholder="Acts 2:42"></label>
    <label class="lbl">Explanation (optional) <textarea id="fexp" rows="2"></textarea></label>
    <button class="btn" id="saveQ">Save question</button>
  </div>
  <div class="bar">
    <button class="btn gold" id="saveQuiz">Save quiz</button>
    <button class="btn" id="cancelEd">Cancel</button>
  </div>
</section>

<!-- GAME: presenter controls + audience stage -->
<section id="game" class="screen" hidden>
  <div id="stage">
    <div class="prog"><div id="pbar"></div></div>
    <div class="meta"><span id="count"></span><span id="timer"></span></div>
    <h2 id="qtext"></h2>
    <div id="cards"></div>
    <div id="refline"></div>
    <div id="expl"></div>
    <div id="scores"></div>
  </div>

  <aside id="panel">
    <h3>Presenter</h3>
    <div id="pinfo"></div>
    <div id="award"></div>
    <div class="btns">
      <button class="btn gold" data-act="start">Start quiz</button>
      <button class="btn" data-act="prev">Previous</button>
      <button class="btn" data-act="next">Next</button>
      <button class="btn gold" data-act="reveal">Reveal answer</button>
      <button class="btn" data-act="explain">Show explanation</button>
      <button class="btn" data-act="present">Presentation mode</button>
      <button class="btn" data-act="restart">Restart</button>
      <button class="btn" data-act="end">End quiz</button>
    </div>
    <p class="hint">Keys: → next, ← previous, Space reveal</p>
  </aside>

  <!-- Small bar shown only in Presentation Mode (fades until hovered) -->
  <div id="toolbar">
    <span id="tbAward"></span>
    <button class="btn" data-act="prev">◀</button>
    <button class="btn gold" data-act="reveal">Reveal</button>
    <button class="btn" data-act="explain">Explanation</button>
    <button class="btn" data-act="next">▶</button>
    <button class="btn" data-act="exit">Exit</button>
  </div>
</section>

<!-- RESULTS -->
<section id="results" class="screen" hidden>
  <h2>Quiz finished!</h2>
  <p id="rtext"></p>
  <div id="rank"></div>
  <div class="bar" style="justify-content:center">
    <button class="btn gold" data-act="restart2">Play again</button>
    <button class="btn" data-act="home">Back to quizzes</button>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
